version: '3.8'

services:
  backend:
    build: ./backend
    container_name: tufffiles-backend
    ports:
      - "5100:5000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=5000
      - JWT_SECRET=supersecretkey
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tufffiles-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
